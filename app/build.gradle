plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.petminder'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.petminder"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
        viewBinding true   // Added for your task fragments
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
        disable 'NewApi'
    }
}

dependencies {
    // Core AndroidX
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"

    // Coroutines (needed for lifecycleScope + delay in SplashActivity)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // Jetpack Compose (with BOM — preferred)
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Additional Compose features from the other branch
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    implementation 'androidx.navigation:navigation-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    // Fragments + RecyclerView for Task Screens
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
