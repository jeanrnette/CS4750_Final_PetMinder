############################################################
# Project-wide Gradle Settings
# ----------------------------------------------------------
# These settings control Gradle behavior across the project.
# IDE (e.g. Android Studio) settings can override these.
############################################################

# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of the legacy support libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Optimize R class generation (smaller class, faster builds)
android.nonTransitiveRClass=true

# ----------------------------------------------------------
# 🔧 Compatibility Fixes
# ----------------------------------------------------------

# Force Gradle to use Kotlin 1.9.20 (required for Compose Compiler 1.5.4)
kotlin.version=1.9.20

# Disable Gradle’s internal Kotlin DSL provider to avoid version override (Gradle 8.13 uses Kotlin 2.0.21 internally)
org.gradle.kotlin.dsl.provider.disable=true

# Optional performance setting: enable Gradle build cache
org.gradle.caching=true

# Optional: enable parallel project execution
# org.gradle.parallel=true
